services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: firebridge-postgres
    environment:
      POSTGRES_USER: firebridge
      POSTGRES_PASSWORD: firebridge
      POSTGRES_DB: firebridge
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firebridge -d firebridge']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firebridge-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firebridge-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DEFAULT_SCOPE_KEY: ${DEFAULT_SCOPE_KEY:-morocco}
      CURSOR_SECRET: ${CURSOR_SECRET:?Set CURSOR_SECRET in .env to at least 32 characters}
      INGESTION_ADMIN_TOKEN: ${INGESTION_ADMIN_TOKEN:-}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
      DATABASE_URL: postgresql://firebridge:firebridge@postgres:5432/firebridge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - exports_data:/app/.data/exports
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: firebridge-worker
    init: true
    stop_grace_period: 35s
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://firebridge:firebridge@postgres:5432/firebridge
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
      ANALYSIS_LEASE_SECONDS: ${ANALYSIS_LEASE_SECONDS:-60}
      ANALYSIS_WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY:-5}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-false}
      RECOVERY_CREATED_AFTER: ${RECOVERY_CREATED_AFTER:-}
      RECOVERY_INTERVAL_MS: ${RECOVERY_INTERVAL_MS:-30000}
      RECOVERY_STALE_SECONDS: ${RECOVERY_STALE_SECONDS:-120}
      RECOVERY_BATCH_SIZE: ${RECOVERY_BATCH_SIZE:-20}
      RECOVERY_MAX_ATTEMPTS: ${RECOVERY_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_data:/app/.data/exports
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/health.js']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  exports_data:
