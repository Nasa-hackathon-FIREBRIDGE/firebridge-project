version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: firebridge-postgres
    environment:
      POSTGRES_USER: firebridge
      POSTGRES_PASSWORD: firebridge
      POSTGRES_DB: firebridge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firebridge -d firebridge']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: firebridge-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firebridge-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DEFAULT_SCOPE_KEY: ${DEFAULT_SCOPE_KEY:-morocco}
      CURSOR_SECRET: ${CURSOR_SECRET:?Set CURSOR_SECRET in .env to at least 32 characters}
      DATABASE_URL: postgresql://firebridge:firebridge@postgres:5432/firebridge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: firebridge-worker
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://firebridge:firebridge@postgres:5432/firebridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
