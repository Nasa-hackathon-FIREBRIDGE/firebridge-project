name: Backend checks

on:
  push:
    branches: [main, staging, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prisma client generation reads the URL without connecting to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/firebridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
