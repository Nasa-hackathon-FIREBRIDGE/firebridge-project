user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    keepalive_timeout 65;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/letsencrypt/live/astramind.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astramind.solutions/privkey.pem;
    upstream backend { server api:3000; keepalive 16; }
    upstream frontend { server frontend:8080; keepalive 8; }
    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location / { return 444; }
    }
    server {
        listen 8080;
        server_name astramind.solutions www.astramind.solutions ogote.com www.ogote.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / { return 308 https://ogote.com$request_uri; }
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name astramind.solutions www.astramind.solutions;
        # Keep existing built clients and agent requests working during the domain cutover.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        location ^~ /api/v1/admin { return 404; }
        location ^~ /api-docs { return 404; }
        # FireBridge AI Agent: Docker DNS is resolved at request time across releases.
        location = /agent { return 308 /agent/; }
        location ^~ /agent/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $agent_endpoint http://firebridge-ai-agent:8000;
            rewrite ^/agent/(.*)$ /$1 break;
            proxy_pass $agent_endpoint;
            proxy_read_timeout 180s;
            proxy_connect_timeout 5s;
            proxy_buffering off;
        }
        location /api/ { proxy_pass http://backend; }
        location / { return 308 https://ogote.com$request_uri; }
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name www.ogote.com;
        ssl_certificate /etc/letsencrypt/live/ogote.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ogote.com/privkey.pem;
        return 308 https://ogote.com$request_uri;
    }
    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name ogote.com;
        ssl_certificate /etc/letsencrypt/live/ogote.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ogote.com/privkey.pem;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        location ^~ /api/v1/admin { return 404; }
        location ^~ /api-docs { return 404; }
        # FireBridge AI Agent: Docker DNS is resolved at request time across releases.
        location = /agent { return 308 /agent/; }
        location ^~ /agent/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $agent_endpoint http://firebridge-ai-agent:8000;
            rewrite ^/agent/(.*)$ /$1 break;
            proxy_pass $agent_endpoint;
            proxy_read_timeout 180s;
            proxy_connect_timeout 5s;
            proxy_buffering off;
        }
        location /api/ { proxy_pass http://backend; }
        location / { proxy_pass http://frontend; }
    }
}
